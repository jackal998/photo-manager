[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = true
default_section = "THIRDPARTY"
known_first_party = ["app", "core", "infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "C4"]
ignore = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "infrastructure"]
combine-as-imports = true

[tool.pylint.main]
py-version = "3.11"
extension-pkg-allow-list = ["PIL"]

[tool.pylint.design]
max-attributes = 24
min-public-methods = 0
max-locals = 55
max-statements = 140
# Allow Windows API structure naming patterns
good-names = ["Data1", "Data2", "Data3", "Data4", "GUID", "SIZE", "BITMAP", "BITMAPINFO", "BITMAPINFOHEADER"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.variables]
additional-builtins = ["Data1", "Data2", "Data3", "Data4"]

[tool.pytest.ini_options]
addopts = "-q --cov=. --cov-report=term-missing --cov-report=json --cov-config=pyproject.toml"
testpaths = ["tests"]
markers = [
    "integration: layer-2 test needing real timing or binaries; skipped in CI, run locally with PHOTO_MANAGER_RUN_INTEGRATION=1 (see docs/testing.md)",
    "web_probe: live Playwright probe needing a built frontend + chromium; gated behind PHOTO_MANAGER_RUN_WEB_PROBE=1 (set by the web-eval-gates CI job) so it never pollutes the main suite's asyncio tests; also auto-skips when playwright/dist absent (see docs/testing.md).",
]

[tool.coverage.run]
branch = true
source = ["scanner", "core", "infrastructure", "app"]
omit = [
  "tests/*",
  "scripts/*",
  ".claude/*",
  # qa/ is the layer-3 driver harness itself (uvicorn + Playwright browser
  # driving, scenario configuration). It can't be exercised inside the
  # layer-1 test process by design; it runs every time qa.web._batch is
  # invoked locally or in the web-scenario-batch CI job.
  "qa/*",
  # `omit` is reserved for files that genuinely cannot be exercised
  # inside the layer-1 test process. Each entry below carries (a) why
  # it isn't reachable from unit tests, and (b) where it IS covered
  # (layer-2 integration / layer-3 qa-explore / manual). Anything NOT
  # in this list must clear the per-file 70% floor enforced by
  # scripts/check_coverage_per_file.py. See docs/testing.md for the
  # full layer model.
  "run_all_linters.py",               # dev tooling shell, not user-facing
  "infrastructure/image_service.py",  # Windows Shell/WIC + COM STA decode paths that need a real desktop session; covered by the web preview scenarios (qa/web/scenarios/s05_huge_preview.py) and the thumbnail-latency bench
  "infrastructure/logging.py",        # loguru sink setup + os.startfile/subprocess file-openers (no unit-testable surface); the pure write_delete_log helper IS covered via test_delete_service.py
  "core/app_service/events.py",       # ScanProgressBus is a runtime_checkable Protocol; its stub method bodies (`...`) cannot be invoked in unit tests — covered by SseScanBus (app/web/routes/scan.py) and _SpyBus (test_scan_runner.py)
]

[tool.towncrier]
name = "photo-manager"
filename = "CHANGELOG.md"
directory = "news"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/jackal998/photo-manager/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 80
