  - scenario: s29_remove_from_list_by_regex
    playwright_module: qa.web.scenarios.s29_remove_from_list_by_regex
    status: done
    notes: "Regex bulk 'remove from list' (action-combo wireValue __ignore__) → asserts the regex-matched rows carry user_decision=='ignore' with non-matched unchanged, via GET /api/manifest. No delete-confirm sheet for ignore (web divergence: only delete confirms). Match partition derived from the regex, not hardcoded."

  - scenario: s30_execute_dialog_regex_right_click
    playwright_module: qa.web.scenarios.s30_execute_dialog_regex_right_click
    status: done
    notes: "Cluster B. Execute-dialog row menu 'Set Action by Field…' (CTX_SET_ACTION_BY_FIELD) opens the manifest-wide ActionDialog via store.openActionDialog (same dialog the toolbar opens); File Name regex matches 3 of 5 → delete, 2 unchanged. Seeds one decision to expose a row in the decided-rows-only execute tree (#676). Bulk-decide skips the manifest_path root guard, so scans the repo fixture dir directly (s43 precedent)."

  - scenario: s31_simple_mode_regex
    playwright_module: qa.web.scenarios.s31_simple_mode_regex
    status: done
    notes: "Simple-mode write-through (action-simple-op/text → action-regex-input) + bulk-decide apply → delete confirm → asserts user_decision via GET /api/manifest. Qt mode-toggle radio + keyboard probes omitted (no web equivalent)."

  - scenario: s32_lock_confirm_bulk_regex
    playwright_module: qa.web.scenarios.s32_lock_confirm_bulk_regex
    status: done
    notes: "Bulk-regex lock-confirm → 'Apply to Unlocked Only' (#674). Locks q95 via File-Name regex (lock is free, no confirm), bulk-deletes q[89]\\d (matches q95 LOCKED + q88 + q80) → DeleteConfirm sheet → 409 locked_paths → the ActionDialog inline lock dialog (ACTION_LOCK_CONFIRM_DIALOG, distinct from the execute-flow LockConfirmDialog s36 uses) → 'Apply to Unlocked Only' (skip_locked re-POST) → asserts q95 stays decision='' is_locked=1, q88/q80 'delete', q72/q65 untouched — via sqlite (authoritative) AND GET /api/manifest (serialization). Unblocked by FE #674 (backend skip_locked + 3rd verdict + testids)."

  - scenario: s33_execute_dialog_jump_to_all_delete
    playwright_module: qa.web.scenarios.s33_execute_dialog_jump_to_all_delete
    status: done
    notes: "All-delete warning banner + per-group jump link. NON-destructive: marks all 5 delete, opens execute dialog, asserts EXECUTE_ALL_DELETE_BANNER visible + the execute-all-delete-jump-{group_number} button visible, clicks the real <button> (web IMPROVES on Qt, which couldn't click the QLabel <a> on hosted CI), Escape-closes, asserts rows unchanged. No file deletion."

