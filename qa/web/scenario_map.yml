# qa/web/scenario_map.yml
#
# Mapping from Qt qa-explore scenario names to their Phase-2+ web driver
# modules.  This file is the single source of truth for which scenarios
# have been ported to the web harness.
#
# Fields per entry
# ----------------
# scenario        : key matching ALL_SCENARIOS in qa/scenarios/_batch.py
# playwright_module: dotted Python module path under qa.web.scenarios, or
#                    null when not yet ported (Phase 1 default)
# status          : todo | in_progress | done | skip
# notes           : free-text, empty string when nothing to say
#
# Invariant: the number of rows in this file must equal len(ALL_SCENARIOS).
# Enforced by scripts/check_qa_parity.py.

scenarios:
  - scenario: s01_happy_path
    playwright_module: qa.web.scenarios.s01_happy_path
    status: done
    notes: "Full happy-path: pre-scan empty-state visible + Action-menu items disabled (Radix data-disabled), scan near-duplicates, post-load asserts status bar 'N groups · M files' + empty-state unmounts + result tree visible + Action-menu items flip enabled. Bundles Qt probes #42/#52/#58. Divergences: web status wording differs from Qt 'Loaded manifest:'; #52 gating asserted on the Action menu (web has no List menu); Radix portals menus lazily so the trigger is clicked before each item-state probe."

  - scenario: s02_empty_folder
    playwright_module: qa.web.scenarios.s02_empty_folder
    status: done
    notes: "Scans a fresh empty tempdir; asserts 0 file rows and '0 groups · 0 files' status bar."

  - scenario: s03_cancel_scan
    playwright_module: qa.web.scenarios.s03_cancel_scan
    status: done
    notes: "Cancel a scan mid-run; two samples, both scanning make_large_source(6000) stubs (the tiny near-dups fixture hashed too fast to land a mid-run cancel on headless CI). Sample 1 (HASH-stage): wait_log_line 'Hashing' (past WALK), click scan-cancel-button, assert scan-dialog hides + main-empty-state visible + 0 rows (app usable, no manifest auto-loaded). Sample 2 (WALK-stage): wait_log_line 'Walking' BEFORE cancel (log unmounts on close), click cancel, assert the never-written output .db is absent on disk AND GET /api/manifest 404s (absence-based manifest-untouched). Divergences: web has an explicit Cancel button (Qt used title-bar-X close == cancel); no OS process/window survival check (SPA page persisting is the proof); large source for both samples (Qt used small sandbox for Sample 1); FAIL-on-fast guards turn a too-fast scan into a clear failure (Qt FAIL-on-Done parity)."

  - scenario: s04_corrupted
    playwright_module: qa.web.scenarios.s04_corrupted
    status: done
    notes: "Scans corrupted sandbox; asserts 0 file rows (truncated JPEG skipped). Log unavailable post-unmount — see divergence note in module."

  - scenario: s05_huge_preview
    playwright_module: qa.web.scenarios.s05_huge_preview
    status: done
    notes: "Heavy-image (50 MP / 1.48 MB) preview + full-res. The lone huge file is a singleton the scanner drops (dedup len(group)<2), so the port copies it twice into a tmpdir to form a 2-member EXACT-hash group with a selectable row, scans, clicks the row, asserts preview-single-image + preview-info visible (bounded size=512 decode) then double-clicks -> fullres-image visible (native size=0 decode, under the 40 MiB 413 guard). STRENGTHENS Qt s05 (zero asserts, tolerates 'no file row found'). Divergences: duplicated fixture; no rapid-click timing micro-benchmark (Qt printed it, never asserted); testid reads vs Qt automation_id."

  - scenario: s06_formats
    playwright_module: qa.web.scenarios.s06_formats
    status: done
    notes: "Multi-format scan (gif/heic/png/tiff/webp). Each format file gets a byte-identical twin so it forms an EXACT-dup pair and survives the manifest singleton-drop — without this only png/heic/webp (which share a pHash) group; gif/tiff get NO pHash from the scanner (verified live) and singleton-drop. Asserts all 5 extensions appear (10 rows). UPGRADES Qt s06 (print-only, no asserts). Divergences: duplicate-to-observe (s05 pattern); manifest file_path read vs Qt tree-cell text; gif/tiff no-pHash surfaced (probe_status) not asserted."

  - scenario: s07_format_dup
    playwright_module: qa.web.scenarios.s07_format_dup
    status: done
    notes: "Format-dup pair (scene_a.heic + scene_a.jpg, same scene). run_scan then GET /api/manifest: 1 group/2 items, HEIC is_ref_winner=True (similarity kind 'ref'), JPG is_ref_winner=False action='REVIEW_DUPLICATE' with near-dup percent in (0,100] (84% live). UPGRADES Qt s07 (print-only). Divergences: HEIC/JPG are near-dup (~10 hamming) not pHash-identical, so REVIEW_DUPLICATE not EXACT (dedup EXACT/format-dup needs hamming==0; the build agent's EXACT/100 assumption was wrong, caught at live-verify); no scan-log probe (ScanProgress unmounts on SSE finished — racy on fast CI), classification asserted from manifest; percent kind+range asserted, not the exact value."

  - scenario: s08_exif_edge
    playwright_module: qa.web.scenarios.s08_exif_edge
    status: done
    notes: "EXIF edge-case dates (6 JPEGs: tz_offset/subsecond/createdate_only/datetime_tag_only/zero_date_sentinel/dash_sentinel). All 6 are distinct singletons (raw fixture → EMPTY manifest = a hollow test), so each is duplicated (byte-identical twin → EXACT-dup pair) to become observable (12 rows). HARD-asserts the 2 DateTimeOriginal-primary files (tz_offset/subsecond) parse non-null and the 2 sentinels (0000-date/dash) parse null; the 2 fallback-tag files (CreateDate/DateTime-only) are OBSERVED not asserted — exiftool-version dependent (createdate_only is null on CI exiftool, dated on local; caught at CI live-verify). UPGRADES Qt s08 (print-only). Divergences: duplicate-to-observe (s05 pattern); canonical shot_date read vs Qt tree text; no UNDATED log probe (log unmounts on SSE finished — racy), undated asserted via sentinel null shot_date."

  - scenario: s09_walker_exclusions
    playwright_module: qa.web.scenarios.s09_walker_exclusions
    status: done
    notes: "Walker exclusion rules. Copies the 2 real photos + a byte-identical twin each (s08 duplicate-to-observe — the raw distinct reals are singletons → empty grouped manifest) plus the excluded non-media files (Thumbs.db/desktop.ini/.json sidecar) into a tmpdir, scans, then asserts the manifest basenames are EXACTLY the 4 real-media files (reals+twins) and each excluded file is absent. The symlink-skip guard is asserted only when os.symlink succeeds (Linux CI); skipped with a probe note on unprivileged Windows. UPGRADES Qt s09 (print-only). Divergences: manifest-JSON basenames vs Qt UIA cell scrape; no scan-log walker-count probe (ScanProgress unmounts on SSE finished — a fast-CI flake per s08 D4)."

  - scenario: s10_multi_source
    playwright_module: qa.web.scenarios.s10_multi_source
    status: done
    notes: "Multi-source priority + cross-source dedup. Scans multi-source-a then multi-source-b in configured order (load-bearing — A first wins ties); shared.jpg is byte-identical across both sources. Asserts via GET /api/manifest: non-empty manifest, >=1 Ref winner, EVERY is_ref_winner item's file_path contains 'multi-source-a' (source-order priority — A's copy is the cross-source keeper), and >=1 group spans both sources (cross-source dedup happened, so the priority assert isn't vacuous). Live: 1 group/3 files, ref=a/shared.jpg. UPGRADES Qt s10 (print-only). Divergences: is_ref_winner+file_path from manifest JSON vs Qt 'Ref' cell scrape; priority asserted by path-marker substring; no scan-log probe."

  - scenario: s11_video_live
    playwright_module: qa.web.scenarios.s11_video_live
    status: done
    notes: "Live Photo HEIC+MOV pair (#88 regression guard). Scans the live-photo fixture; asserts both IMG_0001.HEIC and IMG_0001.MOV appear (the MOV-presence check is the pre-#88 regression guard — the MOV was silently dropped before hashing), both share one group_number, and user_decision=='' post-scan. Divergences: GET /api/manifest JSON vs Qt sqlite read; group_number (int) vs Qt group_id; strict user_decision=='' assert (Qt only WARNed)."

  - scenario: s12_save_manifest
    playwright_module: qa.web.scenarios.s12_save_manifest
    status: done
    notes: "Save Manifest reframed as the live-persistence durability GUARANTEE (#673 Save-Manifest sub-item). The web has no explicit Save step + no dirty state: PATCH /api/decision commits to the manifest DB synchronously (executemany+commit+close, manifest_repository.py:462-471), GET /api/manifest is stateless ('SQLite is the only source of truth'), and POST /api/save is a pure WAL-checkpoint/copy whose docstring says 'decisions are already persisted per-PATCH' (execute_service.py:504-546). So Qt's Save-Manifest intent (decisions survive the session) is met by construction; this scenario verifies it STRICTER than Qt s12: stage Delete via the DecisionControl, assert the VALUE round-trips (Qt only checks table-exists + row counts), then reload (wipes the Zustand store → empty state) + reopen the same .db and assert the decision survives THREE ways — re-rendered control shows 'Delete', GET /api/manifest still 1 decision, and a read-only sqlite read confirms migration_manifest + 'SQLite format 3' header + user_decision='delete' committed on disk. Divergences: no File>Save click / 'Saved N' status (web has no Save step — not the persistence mechanism); decision read via GET /api/manifest + sqlite vs Qt's saved-copy sqlite read. The save-as/export-snapshot product question (POST /api/save target_path as a UI flow) is unevidenced → filed as a deferred follow-up, not built here."

  - scenario: s13_execute_action
    playwright_module: qa.web.scenarios.s13_execute_action
    status: done
    notes: "Destructive execute round-trip. Scans disposable tmpdir copies of near-duplicates, marks all 5 rows delete via context menu, Execute -> all-delete confirm -> Yes, then asserts (absence-based) all 5 files gone from disk AND GET /api/manifest total_files==0 — deleted rows are filtered out by WHERE outcome='' in _LOAD_ALL_SQL, so the contract is ABSENCE, not outcome=='deleted'. Qt regex bulk-mark + executed=1 SQLite read have no web equivalent — context-menu marking + absence assertion used instead. #733 MIXED-MANIFEST phase: two exif-edge groups (A all-delete, B one ignore + two undecided) prove the pre-execute confirm fires per Qt's _complete_delete_groups (ANY qualifying group), not only on a 100%-delete whole scope; asserts Cancel is a no-op and Yes commits group A's deletes + finalizes B's ignore row while B's undecided files survive untouched."

  - scenario: s14_action_by_regex
    playwright_module: qa.web.scenarios.s14_action_by_regex
    status: done
    notes: "Field+regex bulk-decide via the Action menu (2nd ActionDialog entry point). Asserts manifest-gating (menu item disabled pre-scan, enabled post-scan), regex q[89]\\d → delete on the 3 matched rows with the 2 non-matched unchanged, via GET /api/manifest. Qt #397 apply-stays-enabled + folder-regex UIA preview probes have no web equivalent — omitted."

  - scenario: s15_context_menu
    playwright_module: qa.web.scenarios.s15_context_menu
    status: done
    notes: "Right-click → delete / keep; asserts user_decision via GET /api/manifest. Multi-select Ctrl+click not yet implemented in web; drives two single-row operations instead. #735: file-row phase asserts 'Set Action by Field…' (opens ActionDialog, best-effort column-prefill to 'Size (Bytes)' from the size cell) and 'Execute Action (only selected)…' (opens ExecuteDialog); group-row phase right-clicks the group header and asserts the REDUCED menu (By-Field + Remove present, Execute-selected/Keep/Delete/Lock/Open-folder absent)."

  - scenario: s16_open_manifest
    playwright_module: qa.web.scenarios.s16_open_manifest
    status: done
    notes: "Scan→reload→reopen the .db manifest through the FsBrowser file picker (empty-state Open); asserts post-reopen status bar equals post-scan. Exercises .db manifest flagging. Qt's native QFileDialog replaced by the in-DOM picker."

  - scenario: s17_scan_dialog_widgets
    playwright_module: qa.web.scenarios.s17_scan_dialog_widgets
    status: done
    notes: "Drives the scan dialog Browse buttons through the NESTED FsBrowser (directory mode for source, save mode for output); asserts the scan dialog survives the nested layer and both fields are written back. Qt native QFileDialog → in-DOM picker. #736: also proves the three grouping-sensitivity threshold inputs (pHash/dHash/mean-color) land in the POST /api/scan request body (captured via page.expect_request, not a grouping-count delta), and that sources added out of order render alphabetized (display-only) while the POST body's source order stays original insertion order — guarding BUILD RISKS #1 (dedup keeper priority) and #3 (testid idx binding)."

  - scenario: s18_log_menu
    playwright_module: null
    status: skip
    notes: "SKIP — no web equivalent surface. Desktop s18 drives the menu-bar Log menu's four items (Open Latest Log / Open Latest Delete Log / Open Log Directory / Open Delete Log Directory), each shelling os.startfile/xdg-open (infrastructure/logging.py) or popping a QMessageBox. The web MenuBar is File/Action/View only and has NO Log menu (deliberate deferral — MenuBar.tsx:14 'Log menu: depends on the web OS-integration (reveal/open) story'); app/web/routes/ has no /api/log* endpoint and the web layer writes no on-disk app log file. Unlike s19 (Open folder), whose POST /api/reveal already existed for revealing a user PHOTO, there is no analog for revealing the app's own diagnostic logs. Building one needs a product decision on exposing server-side diagnostics through a browser UI plus net-new endpoints + a new menu — new product scope, not a scenario port. Same combined shape as s39 (desktop-only OS integration) + s21 (deliberate MenuBar deferral)."

  - scenario: s19_context_menu_open_folder
    playwright_module: qa.web.scenarios.s19_context_menu_open_folder
    status: done
    notes: "Context-menu 'Open folder' reveal round-trip. Right-click neardup_00_q95.jpg → CTX_OPEN_FOLDER fires POST /api/reveal {file_path}; asserts exactly one reveal request carrying the target basename + a recognised status. Status is platform-dependent: 200 on Windows (Explorer actually spawns, fire-and-forget) / 501 platform_unsupported on the Linux CI runner — both accepted (each proves menu→store→endpoint wiring + path). Qt's CabinetWClass EnumWindows check has no browser analog; asserted on the intercepted request instead. revealInExplorer swallows the 501 as a non-fatal executeError so nothing crashes off-Windows."

  - scenario: s20_multi_remove_from_list
    playwright_module: qa.web.scenarios.s20_multi_remove_from_list
    status: done
    notes: "Cluster D / PR-D1 + #694. Main-tree multi-selection: Ctrl/Cmd+click toggles rows into an ordered selection set; one right-click context-menu verb fans out over the WHOLE selection (App target-resolution rule: right-clicked-in-selection → the selection, else just that row — which also resets the selection to that one row). Branch A: Ctrl-multi-select 3 rows → Delete → all 3 staged 'delete' (fan-out, non-destructive, leaves all 5 rows for later branches). Branch B: a fresh [q72,q65] selection → right-click q95 OUTSIDE → Keep clears only q95 (guards the single-row target-resolution rule that keeps s15/s25/s35/s53 valid). Branch C (#694 headline): the [q72,q65] selection → Remove from list FINALIZES — one click fans out and BOTH rows leave the manifest (outcome='ignored', WHERE outcome='' excludes them) while their files stay on disk (ignored ≠ deleted), matching desktop. #694: the result-tree 'Remove from list' previously only STAGED user_decision='ignore'; it now finalizes, and staging a reversible ignore moved to the per-row DecisionControl dropdown (s53/s60 use that path). DIVERGENCE: the web GroupRow is collapse-only, so the desktop group→file-expansion sub-branch is dropped. /api/remove enforces the allowed-roots guard, so (like s54) the fixtures are copied into a tmpdir and scanned THERE, db written under that root."

  - scenario: s21_list_menu_remove
    playwright_module: qa.web.scenarios.s21_list_menu_remove
    status: done
    notes: "Ported (#678-D closed the List-menu deferral this entry used to record). Drives the MENU-BAR path — distinct from s20's context-menu path — across the Qt branches: single + multi remove finalize outcome='ignored' (asserted via manifest absence AND a direct sqlite outcome read), files stay on disk, untouched rows keep their staged decisions. Deliberate web variant of branch (a): the item is DISABLED without a selection (same gating idiom as s44's Execute-only-selected) instead of Qt's 'No items selected' QMessageBox; the 'Removed N items' status-bar echo remains desktop-only."

  - scenario: s22_language_switch
    playwright_module: qa.web.scenarios.s22_language_switch
    status: done
    notes: "Click main-lang-toggle EN→zh_TW; asserts toolbar re-renders live ('掃描'/'執行'), persistence across page.reload(), and restore to 'en' via PATCH /api/settings. No confirm dialog (web divergence from Qt)."

  - scenario: s23a_set_settings
    playwright_module: qa.web.scenarios.s23a_set_settings
    status: done
    notes: "WRITE side of ScanDialog source persistence (#678-E). Drives 2 sources (one Recursive toggled) + output, Start Scan fires PATCH /api/settings (web analog of Qt _save_to_settings); asserts GET /api/settings has both entries with per-row recursive flags + the output path. Per-scenario reset in _batch.py (reset_scan_persistence) isolates this from later scan scenarios."

  - scenario: s23b_verify_settings
    playwright_module: qa.web.scenarios.s23b_verify_settings
    status: done
    notes: "LOAD side of ScanDialog source persistence (#678-E). Full self-contained round-trip: UI write (Start Scan) -> page.reload() (web cross-launch boundary) -> reopen dialog -> assert load-on-open rebuilt the 2 source rows + recursive flags + output. Also asserts pHash/color thresholds NOT in /api/settings (Qt FORBIDDEN_KEYS parity)."

  - scenario: s24_stale_manifest_paths
    playwright_module: qa.web.scenarios.s24_stale_manifest_paths
    status: done
    notes: "Open a valid sqlite manifest whose SOURCE files were deleted. Scans 3 near-dups copied into a tmpdir subdir (db kept beside, not inside), captures basenames, rmtree's the source subdir, reloads + reopens the manifest. Asserts: load doesn't crash, status_stale == status_scan ('N groups · M files'), PRIMARY every scanned basename still present in GET /api/manifest with total_files unchanged (source-existence-agnostic load — rows not silently dropped), Action-menu items stay enabled. Non-destructive (Qt scopes execute-on-stale-row out). Divergences: basenames asserted via authoritative manifest JSON not Qt DOM TreeItem scraping; web status phrasing vs Qt 'Opened manifest:'."

  - scenario: s25_empty_area_context_menu
    playwright_module: qa.web.scenarios.s25_empty_area_context_menu
    status: done
    notes: "Context menu only on rows, never on empty surfaces (4 branches). A: right-click empty area below the last row (self-validates the viewport is taller than the rows) → CONTEXT_MENU count==0. B: right-click the far-right menu-bar gap → count==0. C: right-click a row with no prior left-click → menu appears with Delete item (indexAt-driven). D: left-click then right-click same row → menu appears (positive control). The web guard is structural: MAIN_RESULT_TREE viewport + MAIN_MENU_BAR carry no onContextMenu; only FileRow does. C/D overlap s15 and are kept as the detector-sanity controls. Browser-native menus have no testid and are Escaped, so they never confound the absence assertion."

  - scenario: s26_keyboard_navigation
    playwright_module: qa.web.scenarios.s26_keyboard_navigation
    status: done
    notes: "HONEST PARTIAL — the DECISION shortcuts (Qt step 0, #615) only. Ports app/views/components/decision_tree_view.py (bare 'd' → user_decision='delete', bare 'k' → '' / no-decision per #584; modifier-bearing presses fall through, Qt NoModifier guard) onto a document-level hook (frontend/src/hooks/useDecisionShortcuts.ts) that drives the SAME store.setDecisions the multi-select context menu uses — true parity, no new mutation path. Three branches over the near-duplicates group: A 'd' single (q95 → 'delete', others clean), B 'k' single (same selection → clears q95 back to '' — the d-vs-k discriminator: a stuck-on-delete/no-op handler fails B, a stuck-on-keep handler fails A), C 'd' multi (q80 + Ctrl+q72 → both 'delete', fan-out over the whole selection). Asserted by user_decision VALUE via GET /api/manifest (a staged 'delete' keeps outcome='' so the row stays visible, no Execute). /api/decision skips the allowed-roots guard so the repo fixture dir is scanned directly with a temp db (s30/s53 precedent). HONEST OMITS (no web equivalent / separate item): ArrowDown roving focus through the virtualizer = a separate FE item (D3b); Alt+F menu mnemonic + Tab-cycle + Esc-dismiss = Qt-native UIA menu/dialog keyboard traversal (Radix owns dialog focus + Esc, the browser owns Tab order); 'p' play/pause = a PreviewPane concern. The hook's guards (modifier held / editable-field target / open-modal inertness) are covered by useDecisionShortcuts.test.ts."

  - scenario: s27_rescan_confirm
    playwright_module: qa.web.scenarios.s27_rescan_confirm
    status: done
    notes: "Re-scan while the loaded manifest has pending decisions → 'Discard pending decisions?' gate (#142). Stage a delete on a row, click Start Scan: Branch A Cancel keeps the decision, runs NO scan, and the scan dialog STAYS OPEN (true Qt parity — the new RescanConfirmDialog is a nested Radix modal, but ScanDialog's onInteractOutside/onEscapeKeyDown guards keep the dialog open while it's up — the same outside-dismiss guarding ExecuteDialog received for its sibling lock-confirm in #721). Branch B Discard & Rescan rebuilds the manifest and clears the decisions. FE feature build: ScanDialog.handleStart now gates on a pendingDecisionCount store selector + a RescanConfirmDialog (en/zh_TW, pluralized count). Pending count verified through GET /api/manifest (the persisted authority the store mirrors)."

  - scenario: s28_exit_dirty_prompt
    playwright_module: null
    status: skip
    notes: "SKIP — desktop-only (#688). Qt MainWindow.closeEvent fires a 3-button QMessageBox (Save / Leave / Back) on dirty-exit, read via pywinauto UIA accessible names. A browser tab has no interceptable OS close with a custom dialog — the only close-time hook is the native beforeunload, which can ARM the browser's own Leave/Stay prompt but cannot replicate a 3-button Save/Leave/Back. The web close-during-scan guard + Leave→cancel are covered by s63 (#687/#703, done); there is no web analog for the Save / Back branches."

  - scenario: s29_remove_from_list_by_regex
    playwright_module: qa.web.scenarios.s29_remove_from_list_by_regex
    status: done
    notes: "Regex bulk 'remove from list' (action-combo wireValue __ignore__) → asserts the regex-matched rows carry user_decision=='ignore' with non-matched unchanged, via GET /api/manifest. No delete-confirm sheet for ignore (web divergence: only delete confirms). Match partition derived from the regex, not hardcoded."

  - scenario: s30_execute_dialog_regex_right_click
    playwright_module: qa.web.scenarios.s30_execute_dialog_regex_right_click
    status: done
    notes: "Cluster B. Execute-dialog row menu 'Set Action by Field…' (CTX_SET_ACTION_BY_FIELD) opens the manifest-wide ActionDialog via store.openActionDialog (same dialog the toolbar opens); File Name regex matches 3 of 5 → delete, 2 unchanged. Seeds one decision to expose a row in the decided-rows-only execute tree (#676). Bulk-decide skips the manifest_path root guard, so scans the repo fixture dir directly (s43 precedent)."

  - scenario: s31_simple_mode_regex
    playwright_module: qa.web.scenarios.s31_simple_mode_regex
    status: done
    notes: "Simple-mode write-through (action-simple-op/text → action-regex-input) + bulk-decide apply → delete confirm → asserts user_decision via GET /api/manifest. Qt mode-toggle radio + keyboard probes omitted (no web equivalent). #741: asserts action-btn-apply stays enabled with an empty pattern, and the delete-confirm shows the pattern-aware summary (action-delete-confirm-summary) + 'Mark N files for deletion' button copy."

  - scenario: s32_lock_confirm_bulk_regex
    playwright_module: qa.web.scenarios.s32_lock_confirm_bulk_regex
    status: done
    notes: "Bulk-regex lock-confirm — Cancel-keeps-open (#764) + 'Apply to Unlocked Only' (#674). Locks q95 via File-Name regex (lock is free, no confirm), bulk-deletes q[89]\\d (matches q95 LOCKED + q88 + q80) → DeleteConfirm sheet → 409 locked_paths → the ActionDialog inline lock dialog (ACTION_LOCK_CONFIRM_DIALOG, distinct from the execute-flow LockConfirmDialog s36 uses). #764 sub-check: clicks ACTION_LOCK_CONFIRM_BTN_CANCEL → asserts the lock dialog hides, the ACTION_DIALOG STAYS visible (pre-fix bug cascade-closed it — the inline lock-confirm is a Radix modal portaled as a SIBLING of ActionDialog so its dismissal fired an outside-interaction the actionRunning-only guard let through, the twin of #721; fix = unconditional preventDefault on ActionDialog.onInteractOutside, Escape left alone), and nothing was applied (sqlite == post-lock snapshot). Then re-Applies on the still-open dialog → back to the lock dialog → 'Apply to Unlocked Only' (skip_locked re-POST) → asserts q95 stays decision='' is_locked=1, q88/q80 'delete', q72/q65 untouched — via sqlite (authoritative) AND GET /api/manifest (serialization). jsdom can't fire the cancel cascade so #764 is proven live here. Unblocked by FE #674 (backend skip_locked + 3rd verdict + testids)."

  - scenario: s33_execute_dialog_jump_to_all_delete
    playwright_module: qa.web.scenarios.s33_execute_dialog_jump_to_all_delete
    status: done
    notes: "All-delete warning banner + per-group jump link. NON-destructive: marks all 5 delete, opens execute dialog, asserts EXECUTE_ALL_DELETE_BANNER visible + the execute-all-delete-jump-{group_number} button visible, clicks the real <button> (web IMPROVES on Qt, which couldn't click the QLabel <a> on hosted CI), Escape-closes, asserts rows unchanged. No file deletion."

  - scenario: s34_lock_confirm_at_execute
    playwright_module: qa.web.scenarios.s34_lock_confirm_at_execute
    status: done
    notes: "Execute-time lock-confirm, Cancel verdict (#182). Scans the 5 near-dups, marks all 5 'delete' via per-row CTX_SET_ACTION_DELETE, locks q95 via CTX_LOCK → Execute → all-delete confirm (web ordering: fires BEFORE the POST) → POST /api/execute 409 locked_paths → LOCK_CONFIRM_DIALOG. Asserts the body contains 'DELETE' (IMMEDIATE/execute context — the web has no per-context apply-button label, so the delete-now cue is asserted on the dialog BODY, not on a Qt-style LOCK_CONFIRM_BTN_UNLOCK_DELETE_IMMEDIATE label). Drives LOCK_CONFIRM_BTN_CANCEL → asserts (a) the lock-confirm dialog is hidden, (b) EXECUTE_DIALOG is STILL visible (handleCancel for op=='execute' clears only lockConflict, never executeOpen — LockConfirmDialog.tsx:108), (c) GET /api/manifest == the pre-execute snapshot (all 5 still 'delete', q95 still is_locked, total_files==5), (d) all 5 tmpdir files remain on disk (the 409 pre-flight + Cancel delete nothing). Sister to s36 (Unlock & Apply) and s32 (Unlocked-Only in the ActionDialog flow); s34 exclusively exercises the Cancel verdict. DIVERGENCE: Qt fires the lock-confirm BEFORE the all-delete confirm; the web reverses the ordering (DeleteConfirmSheet → 409 → LockConfirmDialog) with an identical outcome. Templated on s36."

  - scenario: s35_lock_via_context_menu
    playwright_module: qa.web.scenarios.s35_lock_via_context_menu
    status: done
