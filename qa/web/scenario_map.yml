  - scenario: s40_results_tree_double_click
    playwright_module: qa.web.scenarios.s40_results_tree_double_click
    status: done
    notes: "Group-header expand/collapse toggle. Asserts the GroupRow button aria-expanded='true' initially + member row visible, clicks to collapse → aria-expanded='false' + member row detaches (hidden), clicks again to re-expand → aria-expanded='true' + member visible. Qt DIVERGENCE: Qt double-clicks the header (its native single-click expand is disabled + a custom dispatcher handles it); the web GroupRow toggles on SINGLE click (onClick, no onDoubleClick) — scenario uses click() not dblclick() for the identical observable outcome. NOT the file-row double-click (that's s68's full-res open)."

  - scenario: s41_empty_state_action_buttons
    playwright_module: qa.web.scenarios.s41_empty_state_action_buttons
    status: done
    notes: "Fresh page: asserts main-empty-state shows Scan + Open buttons; Scan opens scan-dialog, Open opens fs-browser. No scan needed (pure UI affordance check)."

  - scenario: s42_scoring
    playwright_module: qa.web.scenarios.s42_scoring
    status: done
    notes: "Composite-score pipeline (near-duplicates quality ordering + scoring-mixed penalties). Two sequential scans into separate temp manifests; asserts every grouped item has score in [0,1] (>=1 non-null, guards silent scoring failure), score-DESC array order (neardup_00_q95 before neardup_04_q65), and scoring_clean outscores Copy/Downloads/no_gps variants. COMPOSITE-SCORE SCOPE ONLY — per-dimension signals gps_present/exif_tag_count/xmp_derived are NOT serialised in FileRow (review_view.py:131-149); deferred to #680. Divergences: GET /api/manifest vs Qt sqlite; per-fixture temp manifest for per-group ordering; SQLite-backdoor for per-dimension rejected (API-only principle)."

  - scenario: s43_numeric_condition
    playwright_module: qa.web.scenarios.s43_numeric_condition
    status: done
    notes: "ActionDialog numeric threshold on Size (Bytes) (#209). Mirrors s56's numeric flow with field=Size. Boundary derived at runtime from the fixture's on-disk sizes (== file_size_bytes the server thresholds on; 2nd-smallest = 17908) so '> boundary' splits the 5 near-dups into exactly 3 matched + 2 unchanged regardless of regen. Drives toolbar ActionDialog → field Size (Bytes) (numeric panel mounts) → cmp '>' + value boundary → counter non-zero (asserted pre-Apply) → action delete → Apply → delete-confirm, then asserts the EXACT 3-vs-2 split via GET /api/manifest (q95/q88/q80 delete, q72/q65 unchanged). Non-destructive. Divergences: counter asserted pre-Apply (the dialog auto-closes post-Apply — s56 precedent); Qt Wave-11 soft probes (A4 threshold icon / B6 Top-N counter / A14 spinbox-5000) omitted (NumericPanel has no validation-icon element)."

  - scenario: s44_execute_highlighted_rows
    playwright_module: qa.web.scenarios.s44_execute_selected_only
    status: done
    notes: "Execute (only selected) — main-tree selection scopes the execute dialog to the selected rows' GROUPS (#430 group-pull) + #410 static label (cluster D / PR-D2). Faithful port of the desktop menu-gated, selection-scoped flow (NOT in-dialog multi-select — completing s64's honest-partial single→multi port is tracked separately, see deferred issue). Adds the gated Action → 'Execute (only selected)…' entry (menu-action-execute-selected, disabled until ≥1 main-tree row is selected — web analog of _refresh_execute_selected_only_enabled) + ExecuteState.scopeGroupNumbers. Uses s60's deterministic 2-EXACT-dup-group exif-edge fixture (tz_offset×2 = group A, subsecond×2 = group B) so scope CONFINEMENT is observable: mark all 4 delete, select ONE group-A row, open the entry → dialog shows BOTH group-A rows (group-pull) and ZERO group-B rows (confinement); Execute → all-delete confirm → group A deleted (absent from disk + manifest) while group B survives on disk with user_decision='delete' intact (the load-bearing discriminator the single-group desktop fixture can't make). Divergences: GET /api/manifest JSON vs Qt SQLite; deleted row detected by manifest absence (outcome='deleted') not executed=1; static label is structural on the web (no 'highlighted' variant ever existed) but asserted to guard a future scoped-label regression. Destructive: each run recycles group A's 2 tmpdir copies."

