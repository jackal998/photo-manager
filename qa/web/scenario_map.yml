# qa/web/scenario_map.yml
#
# Mapping from Qt qa-explore scenario names to their Phase-2+ web driver
# modules.  This file is the single source of truth for which scenarios
# have been ported to the web harness.
#
# Fields per entry
# ----------------
# scenario        : key matching ALL_SCENARIOS in qa/scenarios/_batch.py
# playwright_module: dotted Python module path under qa.web.scenarios, or
#                    null when not yet ported (Phase 1 default)
# status          : todo | in_progress | done | skip
# notes           : free-text, empty string when nothing to say
#
# Invariant: the number of rows in this file must equal len(ALL_SCENARIOS).
# Enforced by scripts/check_qa_parity.py.

scenarios:
  - scenario: s01_happy_path
    playwright_module: qa.web.scenarios.s01_happy_path
    status: done
    notes: "Full happy-path: pre-scan empty-state visible + Action-menu items disabled (Radix data-disabled), scan near-duplicates, post-load asserts status bar 'N groups · M files' + empty-state unmounts + result tree visible + Action-menu items flip enabled. Bundles Qt probes #42/#52/#58. Divergences: web status wording differs from Qt 'Loaded manifest:'; #52 gating asserted on the Action menu (web has no List menu); Radix portals menus lazily so the trigger is clicked before each item-state probe."

  - scenario: s02_empty_folder
    playwright_module: qa.web.scenarios.s02_empty_folder
    status: done
    notes: "Scans a fresh empty tempdir; asserts 0 file rows and '0 groups · 0 files' status bar."

  - scenario: s03_cancel_scan
    playwright_module: qa.web.scenarios.s03_cancel_scan
    status: done
    notes: "Cancel a scan mid-run; two samples, both scanning make_large_source(6000) stubs (the tiny near-dups fixture hashed too fast to land a mid-run cancel on headless CI). Sample 1 (HASH-stage): wait_log_line 'Hashing' (past WALK), click scan-cancel-button, assert scan-dialog hides + main-empty-state visible + 0 rows (app usable, no manifest auto-loaded). Sample 2 (WALK-stage): wait_log_line 'Walking' BEFORE cancel (log unmounts on close), click cancel, assert the never-written output .db is absent on disk AND GET /api/manifest 404s (absence-based manifest-untouched). Divergences: web has an explicit Cancel button (Qt used title-bar-X close == cancel); no OS process/window survival check (SPA page persisting is the proof); large source for both samples (Qt used small sandbox for Sample 1); FAIL-on-fast guards turn a too-fast scan into a clear failure (Qt FAIL-on-Done parity)."

  - scenario: s04_corrupted
    playwright_module: qa.web.scenarios.s04_corrupted
    status: done
    notes: "Scans corrupted sandbox; asserts 0 file rows (truncated JPEG skipped). Log unavailable post-unmount — see divergence note in module."

  - scenario: s05_huge_preview
    playwright_module: qa.web.scenarios.s05_huge_preview
    status: done
    notes: "Heavy-image (50 MP / 1.48 MB) preview + full-res. The lone huge file is a singleton the scanner drops (dedup len(group)<2), so the port copies it twice into a tmpdir to form a 2-member EXACT-hash group with a selectable row, scans, clicks the row, asserts preview-single-image + preview-info visible (bounded size=512 decode) then double-clicks -> fullres-image visible (native size=0 decode, under the 40 MiB 413 guard). STRENGTHENS Qt s05 (zero asserts, tolerates 'no file row found'). Divergences: duplicated fixture; no rapid-click timing micro-benchmark (Qt printed it, never asserted); testid reads vs Qt automation_id."

