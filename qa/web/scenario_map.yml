  - scenario: s14_action_by_regex
    playwright_module: qa.web.scenarios.s14_action_by_regex
    status: done
    notes: "Field+regex bulk-decide via the Action menu (2nd ActionDialog entry point). Asserts manifest-gating (menu item disabled pre-scan, enabled post-scan), regex q[89]\\d → delete on the 3 matched rows with the 2 non-matched unchanged, via GET /api/manifest. Qt #397 apply-stays-enabled + folder-regex UIA preview probes have no web equivalent — omitted."

  - scenario: s15_context_menu
    playwright_module: qa.web.scenarios.s15_context_menu
    status: done
    notes: "Right-click → delete / keep; asserts user_decision via GET /api/manifest. Multi-select Ctrl+click not yet implemented in web; drives two single-row operations instead."

  - scenario: s16_open_manifest
    playwright_module: qa.web.scenarios.s16_open_manifest
    status: done
    notes: "Scan→reload→reopen the .db manifest through the FsBrowser file picker (empty-state Open); asserts post-reopen status bar equals post-scan. Exercises .db manifest flagging. Qt's native QFileDialog replaced by the in-DOM picker."

  - scenario: s17_scan_dialog_widgets
    playwright_module: qa.web.scenarios.s17_scan_dialog_widgets
    status: done
    notes: "Drives the scan dialog Browse buttons through the NESTED FsBrowser (directory mode for source, save mode for output); asserts the scan dialog survives the nested layer and both fields are written back. Qt native QFileDialog → in-DOM picker."

