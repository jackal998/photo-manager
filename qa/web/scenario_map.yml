# qa/web/scenario_map.yml
#
# Mapping from Qt qa-explore scenario names to their Phase-2+ web driver
# modules.  This file is the single source of truth for which scenarios
# have been ported to the web harness.
#
# Fields per entry
# ----------------
# scenario        : key matching ALL_SCENARIOS in qa/scenarios/_batch.py
# playwright_module: dotted Python module path under qa.web.scenarios, or
#                    null when not yet ported (Phase 1 default)
# status          : todo | in_progress | done | skip
# notes           : free-text, empty string when nothing to say
#
# Invariant: the number of rows in this file must equal len(ALL_SCENARIOS).
# Enforced by scripts/check_qa_parity.py.

scenarios:
  - scenario: s01_happy_path
    playwright_module: qa.web.scenarios.s01_happy_path
    status: done
    notes: "Full happy-path: pre-scan empty-state visible + Action-menu items disabled (Radix data-disabled), scan near-duplicates, post-load asserts status bar 'N groups · M files' + empty-state unmounts + result tree visible + Action-menu items flip enabled. Bundles Qt probes #42/#52/#58. Divergences: web status wording differs from Qt 'Loaded manifest:'; #52 gating asserted on the Action menu (web has no List menu); Radix portals menus lazily so the trigger is clicked before each item-state probe."

  - scenario: s02_empty_folder
    playwright_module: qa.web.scenarios.s02_empty_folder
    status: done
    notes: "Scans a fresh empty tempdir; asserts 0 file rows and '0 groups · 0 files' status bar."

  - scenario: s03_cancel_scan
    playwright_module: qa.web.scenarios.s03_cancel_scan
    status: done
    notes: "Cancel a scan mid-run; two samples, both scanning make_large_source(6000) stubs (the tiny near-dups fixture hashed too fast to land a mid-run cancel on headless CI). Sample 1 (HASH-stage): wait_log_line 'Hashing' (past WALK), click scan-cancel-button, assert scan-dialog hides + main-empty-state visible + 0 rows (app usable, no manifest auto-loaded). Sample 2 (WALK-stage): wait_log_line 'Walking' BEFORE cancel (log unmounts on close), click cancel, assert the never-written output .db is absent on disk AND GET /api/manifest 404s (absence-based manifest-untouched). Divergences: web has an explicit Cancel button (Qt used title-bar-X close == cancel); no OS process/window survival check (SPA page persisting is the proof); large source for both samples (Qt used small sandbox for Sample 1); FAIL-on-fast guards turn a too-fast scan into a clear failure (Qt FAIL-on-Done parity)."

  - scenario: s04_corrupted
    playwright_module: qa.web.scenarios.s04_corrupted
    status: done
    notes: "Scans corrupted sandbox; asserts 0 file rows (truncated JPEG skipped). Log unavailable post-unmount — see divergence note in module."

  - scenario: s05_huge_preview
    playwright_module: qa.web.scenarios.s05_huge_preview
    status: done
    notes: "Heavy-image (50 MP / 1.48 MB) preview + full-res. The lone huge file is a singleton the scanner drops (dedup len(group)<2), so the port copies it twice into a tmpdir to form a 2-member EXACT-hash group with a selectable row, scans, clicks the row, asserts preview-single-image + preview-info visible (bounded size=512 decode) then double-clicks -> fullres-image visible (native size=0 decode, under the 40 MiB 413 guard). STRENGTHENS Qt s05 (zero asserts, tolerates 'no file row found'). Divergences: duplicated fixture; no rapid-click timing micro-benchmark (Qt printed it, never asserted); testid reads vs Qt automation_id."

  - scenario: s06_formats
    playwright_module: qa.web.scenarios.s06_formats
    status: done
    notes: "Multi-format scan (gif/heic/png/tiff/webp). Each format file gets a byte-identical twin so it forms an EXACT-dup pair and survives the manifest singleton-drop — without this only png/heic/webp (which share a pHash) group; gif/tiff get NO pHash from the scanner (verified live) and singleton-drop. Asserts all 5 extensions appear (10 rows). UPGRADES Qt s06 (print-only, no asserts). Divergences: duplicate-to-observe (s05 pattern); manifest file_path read vs Qt tree-cell text; gif/tiff no-pHash surfaced (probe_status) not asserted."

  - scenario: s07_format_dup
    playwright_module: qa.web.scenarios.s07_format_dup
    status: done
    notes: "Format-dup pair (scene_a.heic + scene_a.jpg, same scene). run_scan then GET /api/manifest: 1 group/2 items, HEIC is_ref_winner=True (similarity kind 'ref'), JPG is_ref_winner=False action='REVIEW_DUPLICATE' with near-dup percent in (0,100] (84% live). UPGRADES Qt s07 (print-only). Divergences: HEIC/JPG are near-dup (~10 hamming) not pHash-identical, so REVIEW_DUPLICATE not EXACT (dedup EXACT/format-dup needs hamming==0; the build agent's EXACT/100 assumption was wrong, caught at live-verify); no scan-log probe (ScanProgress unmounts on SSE finished — racy on fast CI), classification asserted from manifest; percent kind+range asserted, not the exact value."

  - scenario: s08_exif_edge
    playwright_module: qa.web.scenarios.s08_exif_edge
    status: done
    notes: "EXIF edge-case dates (6 JPEGs: tz_offset/subsecond/createdate_only/datetime_tag_only/zero_date_sentinel/dash_sentinel). All 6 are distinct singletons (raw fixture → EMPTY manifest = a hollow test), so each is duplicated (byte-identical twin → EXACT-dup pair) to become observable (12 rows). HARD-asserts the 2 DateTimeOriginal-primary files (tz_offset/subsecond) parse non-null and the 2 sentinels (0000-date/dash) parse null; the 2 fallback-tag files (CreateDate/DateTime-only) are OBSERVED not asserted — exiftool-version dependent (createdate_only is null on CI exiftool, dated on local; caught at CI live-verify). UPGRADES Qt s08 (print-only). Divergences: duplicate-to-observe (s05 pattern); canonical shot_date read vs Qt tree text; no UNDATED log probe (log unmounts on SSE finished — racy), undated asserted via sentinel null shot_date."

  - scenario: s09_walker_exclusions
    playwright_module: qa.web.scenarios.s09_walker_exclusions
    status: done
    notes: "Walker exclusion rules. Copies the 2 real photos + a byte-identical twin each (s08 duplicate-to-observe — the raw distinct reals are singletons → empty grouped manifest) plus the excluded non-media files (Thumbs.db/desktop.ini/.json sidecar) into a tmpdir, scans, then asserts the manifest basenames are EXACTLY the 4 real-media files (reals+twins) and each excluded file is absent. The symlink-skip guard is asserted only when os.symlink succeeds (Linux CI); skipped with a probe note on unprivileged Windows. UPGRADES Qt s09 (print-only). Divergences: manifest-JSON basenames vs Qt UIA cell scrape; no scan-log walker-count probe (ScanProgress unmounts on SSE finished — a fast-CI flake per s08 D4)."

  - scenario: s10_multi_source
    playwright_module: qa.web.scenarios.s10_multi_source
    status: done
    notes: "Multi-source priority + cross-source dedup. Scans multi-source-a then multi-source-b in configured order (load-bearing — A first wins ties); shared.jpg is byte-identical across both sources. Asserts via GET /api/manifest: non-empty manifest, >=1 Ref winner, EVERY is_ref_winner item's file_path contains 'multi-source-a' (source-order priority — A's copy is the cross-source keeper), and >=1 group spans both sources (cross-source dedup happened, so the priority assert isn't vacuous). Live: 1 group/3 files, ref=a/shared.jpg. UPGRADES Qt s10 (print-only). Divergences: is_ref_winner+file_path from manifest JSON vs Qt 'Ref' cell scrape; priority asserted by path-marker substring; no scan-log probe."

  - scenario: s11_video_live
    playwright_module: qa.web.scenarios.s11_video_live
    status: done
    notes: "Live Photo HEIC+MOV pair (#88 regression guard). Scans the live-photo fixture; asserts both IMG_0001.HEIC and IMG_0001.MOV appear (the MOV-presence check is the pre-#88 regression guard — the MOV was silently dropped before hashing), both share one group_number, and user_decision=='' post-scan. Divergences: GET /api/manifest JSON vs Qt sqlite read; group_number (int) vs Qt group_id; strict user_decision=='' assert (Qt only WARNed)."

  - scenario: s12_save_manifest
    playwright_module: null
    status: todo
    notes: ""

  - scenario: s13_execute_action
    playwright_module: qa.web.scenarios.s13_execute_action
    status: done
    notes: "Destructive execute round-trip. Scans disposable tmpdir copies of near-duplicates, marks all 5 rows delete via context menu, Execute -> all-delete confirm -> Yes, then asserts (absence-based) all 5 files gone from disk AND GET /api/manifest total_files==0 — deleted rows are filtered out by WHERE outcome='' in _LOAD_ALL_SQL, so the contract is ABSENCE, not outcome=='deleted'. Qt regex bulk-mark + executed=1 SQLite read have no web equivalent — context-menu marking + absence assertion used instead."

  - scenario: s14_action_by_regex
    playwright_module: qa.web.scenarios.s14_action_by_regex
    status: done
    notes: "Field+regex bulk-decide via the Action menu (2nd ActionDialog entry point). Asserts manifest-gating (menu item disabled pre-scan, enabled post-scan), regex q[89]\\d → delete on the 3 matched rows with the 2 non-matched unchanged, via GET /api/manifest. Qt #397 apply-stays-enabled + folder-regex UIA preview probes have no web equivalent — omitted."

  - scenario: s15_context_menu
    playwright_module: qa.web.scenarios.s15_context_menu
    status: done
    notes: "Right-click → delete / keep; asserts user_decision via GET /api/manifest. Multi-select Ctrl+click not yet implemented in web; drives two single-row operations instead."

  - scenario: s16_open_manifest
    playwright_module: qa.web.scenarios.s16_open_manifest
    status: done
    notes: "Scan→reload→reopen the .db manifest through the FsBrowser file picker (empty-state Open); asserts post-reopen status bar equals post-scan. Exercises .db manifest flagging. Qt's native QFileDialog replaced by the in-DOM picker."

  - scenario: s17_scan_dialog_widgets
    playwright_module: qa.web.scenarios.s17_scan_dialog_widgets
    status: done
    notes: "Drives the scan dialog Browse buttons through the NESTED FsBrowser (directory mode for source, save mode for output); asserts the scan dialog survives the nested layer and both fields are written back. Qt native QFileDialog → in-DOM picker."

  - scenario: s18_log_menu
    playwright_module: null
    status: todo
