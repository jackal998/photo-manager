  - scenario: s35_lock_via_context_menu
    playwright_module: qa.web.scenarios.s35_lock_via_context_menu
    status: done
    notes: "Lock/Unlock a row via the right-click context menu. (a) lock q95 → only q95 is_locked; (b) re-right-click q95 (menu now offers Unlock per the live is_locked) → unlock → all clear; (c) lock q88 then q80 (two sequential single-row ops = web multi-select divergence, s15 precedent) → both locked, q95/q72/q65 stay unlocked; (d) unlock both → all clear. Asserts is_locked via GET /api/manifest with a short poll absorbing the async PATCH /api/lock; is_locked stays orthogonal to user_decision. Uses CTX_LOCK/CTX_UNLOCK (the mutually-exclusive ContextMenu item, also used by s36)."

  - scenario: s36_lock_confirm_destructive_execute
    playwright_module: qa.web.scenarios.s36_lock_confirm_destructive_execute
    status: done
    notes: "Lock-confirm -> Unlock & Apply -> delete fires on the previously-locked row. Locks q95, marks all 5 delete, Execute -> all-delete confirm -> POST returns 409 locked_paths -> LOCK_CONFIRM_DIALOG -> Unlock & Apply (re-POST force_locked=true) -> asserts all 5 gone from disk + total_files==0. Web modal ordering (all-delete confirm BEFORE lock-confirm) differs from Qt; final outcome identical. Uses the EXECUTE-flow LockConfirmDialog (testid'd), distinct from the ActionDialog inline lock dialog that blocks s32."

