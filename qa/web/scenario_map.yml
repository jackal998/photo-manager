    notes: "Opens execute dialog, clicks a row, asserts execute-preview-image visible. Non-destructive (Escape to close). Qt QSplitter + PreviewPane header UIA checks replaced by DOM testid assertions."

  - scenario: s52_similarity_against_displayed_ref
    playwright_module: qa.web.scenarios.s52_similarity_against_displayed_ref
    status: done
    notes: "#253 render-time similarity recompute. Scans near-duplicates; asserts every grouped item has a non-empty phash, exactly one is_ref_winner across all groups, and each REVIEW_DUPLICATE's server-computed similarity.percent == round((64-hamming)/64*100) recomputed (via imagehash) between the Ref's phash and the dup's phash (range-only [0,100] fallback when imagehash is absent). Divergences: asserts the server-computed similarity the user sees vs Qt local imagehash recompute; GET /api/manifest vs Qt sqlite; is_ref_winner read directly vs Qt _pick_displayed_ref replication."

  - scenario: s53_execute_dialog_lock_decision
