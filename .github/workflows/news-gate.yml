name: news-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: news-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  require-news-fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The gate decision itself lives in scripts/hooks/news_guard.py, not
      # inline here (#858). Inline it was `grep -Fq '[skip-news:'` — a
      # fixed-string PREFIX match with no test around it, so it accepted a
      # blank reason, an unclosed bracket, and any PR body that merely
      # quoted the token. Python is where a value-domain test can reach it:
      # tests/test_news_guard.py. Same shape as pr-gates.yml calling
      # docs_guard.py --ci.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: news_guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # PR title + body feed the bypass-token check. Passed via env (not
          # shell args) so bodies containing $(...), backticks or quotes
          # can't break the invocation — same posture as pr-gates.yml.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # The list of files this PR ADDS, newline-separated. Taken from
          # the GitHub API (paginated) rather than `git diff` so the gate
          # doesn't depend on the checkout's history depth. Kept in a shell
          # variable rather than $GITHUB_ENV: the values are attacker-
          # controllable filenames, and a step-local export has no
          # multi-line injection surface.
          ADDED_FILES=$(gh api \
            --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status == "added") | .filename')
          export ADDED_FILES

          python scripts/hooks/news_guard.py --ci
