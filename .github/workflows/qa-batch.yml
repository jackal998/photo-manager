name: qa-batch

# Layer-3 qa-explore batch (#74) — LEGACY coverage of the PySide6 Qt
# desktop client, and of nothing else.
#
# What gates a PR is web QA. `.github/workflows/web-eval-gates.yml`
# (web-scenario-batch's Playwright scenarios, web-dom-probe,
# qa-parity-counter, bench-sanity) runs on EVERY pull request and has been
# BLOCKING since PR #817 (#773); `scripts/check_qa_parity.py --phase 4`
# reports 71/71 scenarios ported. So the shared backend — core/, scanner/,
# infrastructure/ — is already exercised end-to-end through the web client
# on every PR, whatever this workflow does.
#
# Therefore these shards run ONLY when a Qt surface changes (#863). The
# `paths:` allowlist below replaced the old `paths-ignore` skip list: that
# list only excused frontend/docs/news/*.md, so the five shards (~30
# windows-latest runner-minutes) fired on every other PR — including ones
# that cannot touch the Qt client at all: qa/web/** (#855),
# scripts/hooks/** (#859), infrastructure/** + its tests (#860), tests/**,
# app/web/**, .claude/**. Every allowlist entry is the Qt client itself,
# the UIA driver code, a fixture the drivers assert against, or a
# dependency pin only this suite exercises; each is annotated inline.
#
# Deliberately NOT on the allowlist: core/**, scanner/**, infrastructure/**
# and the rest of the shared backend, plus tests/**, scripts/hooks/** and
# dev-requirements.txt (lint/test tooling the drivers never import). The
# accepted trade-off: a shared-backend change that breaks ONLY the Qt
# client is not caught until the next Qt-surface PR or a manual
# workflow_dispatch. That is deliberate — the packaged release no longer
# ships the Qt UI (#774) and this whole suite is deleted with the Phase-4
# cutover (#646). Adding a shared directory back would restore exactly the
# duplicated coverage #863 removed.
#
# Status: NON-REQUIRED, informational — and the allowlist is safe
# SPECIFICALLY because of that. A `paths:` miss makes GitHub Actions skip
# the check entirely rather than report a status, so this workflow must
# never become a required check while this filter is in place: a
# skipped-but-required check gets stuck pending forever (see tests.yml and
# web-eval-gates.yml, which both use the job-always-runs + step-level
# `if:` pattern for exactly that reason). #74's original acceptance
# criterion — "≥10 consecutive flake-free runs, then promote to a required
# status check" — is SUPERSEDED by the owner's 2026-09-06 decision (#863):
# web QA is the gate, and these shards stay informational until they are
# deleted. Treat a red qa-batch as a signal to investigate, not a blocker.
#
# Sharding (#188). The batch is split across 5 parallel jobs via
# strategy.matrix to bring wall-clock from ~15–20 min down toward ~5 min.
# Selection is sorted-stride in qa/scenarios/_batch.py::select_shard, which
# also keeps s23a/s23b in the same shard (s23b reads what s23a wrote).
#
# Why 5 and not more? Per-shard fixed overhead (~1.5 min: checkout + pip +
# exiftool + sandbox build) is paid per shard in parallel. Past ~5 shards
# the fixed-overhead floor dominates the scenario-time savings, so further
# shards mostly burn runner minutes for diminishing wall-clock wins. Plenty
# of headroom remains under GitHub's free-tier 20-concurrent-job cap
# (https://docs.github.com/en/actions/reference/actions-limits) and the
# 256-jobs-per-matrix hard limit
# (https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs).

on:
  # Every target branch, not just master — stacked PRs (whose base is
  # another feature branch) need per-stage CI too. See tests.yml.
  #
  # Qt-surface allowlist (#863). GitHub runs the workflow when ANY changed
  # file matches ANY pattern here; `**` crosses directory boundaries. The
  # per-entry justification is the grep of everything the UIA drivers
  # import or launch — see the header for what is deliberately absent.
  pull_request:
    paths:
      # The Qt client. `main.py` is the process the drivers launch;
      # `launcher.py` still boots it (`main.main()`) on the desktop path;
      # `app/viewmodels/` is the view-model `main.py` hands to MainWindow —
      # the web client only reaches the slice re-exported through
      # core/app_service/review_service.py, so Qt-visible grouping/sort
      # behaviour there is not covered by the web suite.
      - 'app/views/**'
      - 'app/viewmodels/**'
      - 'main.py'
      - 'launcher.py'
      # The UIA drivers themselves, the standalone probes
      # (qa/probes/*.py, which import app.views.dialogs directly), and the
      # scenario registry qa/scenarios/_batch.py imports for shard
      # selection (it lives outside qa/scenarios/ so the web runner can
      # read it without pulling in the Qt batch machinery).
      - 'qa/scenarios/**'
      - 'qa/probes/**'
      - 'qa/scenario_ids.py'
      # Fixtures the drivers assert against, plus the two generators that
      # build them: make_qa_sandbox.py is this workflow's own "Build qa
      # sandbox fixtures" step, and make_qa_large_source.py is imported at
      # runtime by s03_cancel_scan / s63_late_cancel.
      - 'qa/sandbox/**'
      - 'scripts/make_qa_sandbox.py'
      - 'scripts/make_qa_large_source.py'
      # The strings the drivers locate widgets by (UIA names are the
      # localised labels; qa/scenarios/_batch.py loads this catalog to
      # resolve the exit-prompt button names).
      - 'translations/**'
      # Dependency pins only this suite exercises: requirements.txt pins
      # PySide6, whose widget / UIA behaviour no browser-based suite can
      # observe, and qa/requirements.txt pins pywinauto, the driver
      # library itself. (dev-requirements.txt is lint/test tooling the
      # drivers never import — deliberately absent.)
      - 'requirements.txt'
      - 'qa/requirements.txt'
      # This file, so any change to the allowlist is exercised by the
      # shards it governs.
      - '.github/workflows/qa-batch.yml'
  workflow_dispatch: {}   # manual trigger from the Actions UI — the escape
                          # hatch for running the Qt suite against a change
                          # the allowlist above deliberately skips

# Public-repo hardening: workflow is read-only, no write back to the repo,
# no token-scoped operations. Locking permissions explicitly here keeps it
# audit-ready and resilient to future GitHub default changes.
permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 20
    # Concurrency must live at the job level (not workflow level): the
    # ``matrix`` context is only in scope inside a job, so a workflow-level
    # group key referencing ``matrix.shard`` is a workflow-file error and
    # the run fails at parse time. Including the shard number in the key
    # is what lets all 3 shards of the same PR coexist — without it,
    # GitHub Actions would cancel earlier shards when the next one starts.
    concurrency:
      group: qa-batch-${{ github.head_ref || github.ref }}-shard${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      # Don't cancel sibling shards when one fails — we want a full picture
      # of which scenarios failed across the whole batch from a single run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt
            qa/requirements.txt

      # exiftool is a runtime boundary the scanner uses for HEIC / RAW / MOV /
      # MP4 metadata. Chocolatey is preinstalled on windows-latest runners.
      - name: Install exiftool
        run: choco install exiftool -y --no-progress

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install -r qa/requirements.txt

      # Idempotent fixture builder. Generates qa/sandbox/ on a fresh checkout.
      - name: Build qa sandbox fixtures
        run: python scripts/make_qa_sandbox.py

      - name: Run qa batch
        id: batch
        shell: pwsh
        env:
          QT_ACCESSIBILITY: '1'
          # Pin DPI so pixel-coord clicks (s17, s20) match local-dev positions.
          QT_SCALE_FACTOR: '1'
          QT_AUTO_SCREEN_SCALE_FACTOR: '0'
          # Force unbuffered stdout so the live log surfaces in the runner UI.
          PYTHONUNBUFFERED: '1'
          # Unicode arrows / ellipsis in driver output: avoid cp1252 encode errors.
          PYTHONIOENCODING: 'utf-8'
          # Switch QFileDialog to Qt's non-native widget on hosted runners
          # (#129). The Windows native IFileSaveDialog modal loop only pumps
          # COM messages, so synthesized input from pywinauto / UIA is
          # silently dropped on windows-latest. Qt's non-native dialog
          # responds to UIA normally, so s12_save_manifest can drive it
          # end-to-end here. Local users still get the native dialog.
          PHOTO_MANAGER_QT_FILE_DIALOG: '1'
        run: |
          # Force UTF-8 for PowerShell's stdout decode/encode pipeline so
          # box-drawing chars (─ U+2500) and other non-ASCII Unicode in
          # the scanner's summary banner render correctly in the runner
          # log instead of mojibake (`â”€` for `─`). Python writes UTF-8
          # via PYTHONIOENCODING above, but PowerShell on hosted runners
          # defaults to the OEM codepage for child-process I/O.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          python -m qa.scenarios._batch --shard ${{ matrix.shard }} --total-shards 5 2>&1 | Tee-Object -FilePath qa-batch.log
          # Forward the batch's exit code; PowerShell pipes default to the
          # tail-element rc which is Tee-Object's (always 0). The variable
          # `$LASTEXITCODE` from the python invocation is what matters.
          exit $LASTEXITCODE

      # Probe-layer promotion detector (#243 follow-up). Soft probes
      # embedded inside scenarios print `probe_status: XFAIL_KNOWN_BUG_N`
      # while the target bug exists, and `probe_status: PASS …` once
      # the bug is fixed. The scenario itself still passes either way
      # (soft-fail by design so qa-batch stays green during known-bug
      # windows). This step closes the loop: when the bug is fixed
      # and the probe starts emitting PASS, fail the job so the bug-fix
      # PR is forced to either (a) promote the probe to a hard
      # `failures.append(...)` in the scenario, or (b) delete the soft
      # probe block entirely. Mirrors the role @pytest.mark.xfail(strict=True)
      # plays for the static probes in tests/test_ui_probes.py.
      - name: Detect probes ready for promotion
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path qa-batch.log)) { exit 0 }
          $passes = Select-String -Path qa-batch.log -Pattern 'probe_status:\s*PASS'
          if ($passes) {
            Write-Host '::error::A soft probe is now passing — its target bug appears to be fixed.'
            Write-Host '::error::Promote it to a hard assertion (failures.append) in the scenario, or delete the probe block.'
            Write-Host '::error::See docs/testing.md "Probes" section and the comment block in the affected scenario.'
            Write-Host ''
            Write-Host 'Matching log lines:'
            $passes | ForEach-Object { Write-Host "  $($_.Line)" }
            exit 1
          }

      # Always emit a per-scenario rc summary to the job page so triage from
      # the PR is one click. Runs even on failure so we see WHICH scenarios
      # failed without digging through the full log.
      - name: Per-scenario summary
        if: always()
        shell: pwsh
        run: |
          $heading = '## QA batch summary (shard ${{ matrix.shard }}/5)'
          if (Test-Path qa-batch.log) {
            Add-Content $env:GITHUB_STEP_SUMMARY $heading
            Add-Content $env:GITHUB_STEP_SUMMARY ''
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Select-String -Path qa-batch.log -Pattern '^=====|^total:|^\s+\[(OK|FAIL)\]' |
              ForEach-Object { $_.Line } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY $heading
            Add-Content $env:GITHUB_STEP_SUMMARY ''
            Add-Content $env:GITHUB_STEP_SUMMARY '_qa-batch.log was not produced — see the "Run qa batch" step for setup-time errors._'
          }

      # Upload the full log so debugging a failed scenario doesn't require
      # re-running CI. 7-day retention is plenty for triage cycles. The name
      # is suffixed with the shard number because upload-artifact@v4 rejects
      # duplicate names within a single workflow run.
      - name: Upload full batch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-batch-log-shard${{ matrix.shard }}
          path: qa-batch.log
          if-no-files-found: ignore
          retention-days: 7

      # Belt-and-braces cleanup. The runner is ephemeral so this rarely
      # matters, but a hung main.py from a flaky scenario can leave
      # background processes that confuse subsequent steps within the same
      # job. Always exit 0 — failure in cleanup must not mask the real result.
      - name: Cleanup any leaked python.exe
        if: always()
        shell: pwsh
        run: |
          taskkill /F /IM python.exe /T 2>$null
          exit 0
