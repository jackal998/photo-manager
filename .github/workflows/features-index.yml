name: features-index

# Guards the generated index of docs/features.md (scripts/gen_features_index.py).
# Its own workflow, not a step in tests.yml: tests.yml skips pytest on
# docs-only diffs, and pr-gates.yml is PR-only while its gates need PR context,
# so a push-to-master trigger there would run them on master pushes.
# No paths filter: docs-only PRs are exactly what this check exists for.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  features-index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only, so no pip step. Exit 1 = index stale, exit 2 = structural error.
      - name: features index is up to date
        run: python scripts/gen_features_index.py --check

  # Same trigger and no paths filter as the job above: the rules register is
  # linted on every PR and every master push, not only when rules.md changes.
  # Stdlib only. Exit 1 = a register problem (named by rule ID).
  rules-register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: rules register is well formed and its pins resolve
        run: python scripts/check_rules_register.py

      # Same job and trigger: the design rulings register (docs/design/rulings.md)
      # is checked for unique IDs, the five fields, Status and supersession links.
      - name: design rulings register is well formed
        run: python scripts/check_rulings_register.py
