name: web-eval-gates
# Advisory gate during Phases 1–3; REQUIRED at Phase 4 cutover.
# Controls whether the eval gate is blocking via the repo variable WEB_PORT_PHASE.
# The scan-bench-sanity job from the design doc is omitted until
# scripts/bench_web_port.py exists (a later perf PR).
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/web/**'
      - 'qa/web/**'
      - 'tests/test_web_dom_probes.py'
      - 'tests/conftest.py'
      - 'scripts/check_qa_parity.py'
      - '.github/workflows/web-eval-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-parity-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEB_PORT_PHASE: ${{ vars.WEB_PORT_PHASE || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: QA parity counter
        run: python scripts/check_qa_parity.py --phase ${{ env.WEB_PORT_PHASE }}
        # Non-blocking until Phase 4: continue-on-error: true
        # At Phase 4 cutover: remove continue-on-error
        continue-on-error: true

  web-dom-probe:
    # Advisory: builds the frontend, launches uvicorn, and runs the live
    # Playwright DOM probe (tests/test_web_dom_probes.py -m web_probe).
    # Failures surface in the job log and PR checks but do NOT block merge
    # during Phases 1–3 (continue-on-error: true).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    env:
      # Un-gates the live probe (skipif PHOTO_MANAGER_RUN_WEB_PROBE in the test).
      PHOTO_MANAGER_RUN_WEB_PROBE: "1"
    steps:
      - uses: actions/checkout@v4

      # Build the frontend — produces frontend/dist that the SPA mount serves.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Install Python project dependencies (same as tests.yml).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      # Install Playwright and the Chromium browser.
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # Run only the web_probe-marked tests (live DOM probe).
      # --no-cov: this partial run must not write a misleading coverage.json
      # (the per-file floor is enforced by the full pytest run in tests.yml).
      - name: Run web DOM probe
        run: python -m pytest tests/test_web_dom_probes.py -m web_probe -v --no-cov

  web-scenario-batch:
    # Advisory: builds the frontend, builds the qa sandbox, starts uvicorn, and
    # runs the full web scenario batch (qa.web._batch).
    # Only scenarios with status: done in scenario_map.yml run — todo/skip entries
    # degrade to SKIP so the job always finishes cleanly.
    # Failures surface in the job log and PR checks but do NOT block merge
    # during Phases 1–3 (continue-on-error: true).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Build the frontend — produces frontend/dist that the SPA mount serves.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Install Python project dependencies (same as tests.yml).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      # Install Playwright and the Chromium browser.
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # Build the qa/sandbox/ fixture tree (idempotent).
      - name: Build QA sandbox fixtures
        run: python scripts/make_qa_sandbox.py

      # Start the FastAPI server in the background and wait for /api/health.
      - name: Start server
        run: |
          python -m app.web.main &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy within 20s" >&2
          kill "$SERVER_PID" 2>/dev/null || true
          exit 1

      # Run all web scenarios (status:done entries run; todo/skip degrade to SKIP).
      - name: Run web scenario batch
        run: python -m qa.web._batch --base-url http://127.0.0.1:8765
